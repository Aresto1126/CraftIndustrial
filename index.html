<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="クラフト管理">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<title>クラフト管理</title>
</head>
<body>
<header><h1 id="title">クラフト管理</h1><button id="addBtn" class="primary">＋ 追加</button></header>
<main id="main"></main>
<nav>
  <button data-tab="items" class="active">📦<span>アイテム</span></button>
  <button data-tab="calc">🧮<span>計算</span></button>
  <button data-tab="settings">⚙️<span>設定</span></button>
</nav>

<dialog id="editor">
  <form method="dialog" id="editForm">
    <h2 id="editTitle">アイテム</h2>
    <label>名前<input name="name" required autocomplete="off"></label>
    <label>ゲーム／カテゴリ<input name="game" list="games" autocomplete="off" placeholder="例: サティスファクトリー"></label>
    <datalist id="games"></datalist>
    <label>状態
      <select name="status">
        <option value="none">未作成</option>
        <option value="manual">手動で作成</option>
        <option value="auto">自動化済み</option>
      </select>
    </label>
    <fieldset>
      <legend>レシピ（空なら原料・資源として扱う）</legend>
      <label>1回の製作で得られる数<input name="outQty" type="number" min="0" step="any" value="1" inputmode="decimal"></label>
      <div id="inputs"></div>
      <button type="button" id="addInput">＋ 材料を追加</button>
    </fieldset>
    <label>メモ<textarea name="note" rows="2"></textarea></label>
    <div class="row">
      <button type="button" id="delBtn" class="danger">削除</button>
      <span class="grow"></span>
      <button type="button" id="cancelBtn">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
